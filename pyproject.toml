[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melobudsnext"
version = "0.1.0"
description = "Controle do fone QCY Melobuds Pro via BLE, feito por engenharia reversa (Game Mode, ANC, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "bleak",
]

[project.scripts]
melobudsnext = "melobudsnext.cli:main"

[tool.setuptools.packages.find]
include = ["melobudsnext*"]
